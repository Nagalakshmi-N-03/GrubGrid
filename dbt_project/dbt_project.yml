name: grubgrid
version: "1.0.0"
config-version: 2

profile: grubgrid

model-paths: ["models"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  grubgrid:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts